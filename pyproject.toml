[project]
name = "sleeper-mcp"
version = "0.1.0"
description = "MCP server for Sleeper Fantasy Football"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "diskcache>=5.6",
    "pydantic>=2.0",
]

[project.scripts]
sleeper-mcp = "sleeper_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sleeper_mcp"]
